<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- viewport：适配手机浏览器 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>四级单词四选一刷题</title>
<style>
  /* ========== 全局基础样式（护眼柔和配色） ========== */
  :root {
    --bg: #f4f1e8;          /* 米白背景，护眼 */
    --card: #fffdf7;        /* 卡片底色 */
    --text: #3a3a32;        /* 主文字 */
    --muted: #8a8a7a;       /* 次要文字（音标等） */
    --primary: #7a9e7e;     /* 柔和绿 */
    --primary-dark: #5f8264;
    --right: #7a9e7e;       /* 答对绿 */
    --wrong: #c17c6e;       /* 答错暖红 */
    --border: #e3ddcc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
  }

  /* ========== 页面主体容器（居中，限制最大宽度） ========== */
  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ========== 顶部统计面板 ========== */
  .stats {
    display: flex;
    justify-content: space-around;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 8px;
  }
  .stat-item { text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; }
  .stat-num.known { color: var(--right); }
  .stat-num.unknown { color: var(--wrong); }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ========== 模式切换按钮 ========== */
  .mode-bar { display: flex; gap: 10px; }
  .mode-btn {
    flex: 1;
    padding: 12px 0;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    transition: all .2s;
  }
  .mode-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    font-weight: 600;
  }

  /* ========== 单词卡片 ========== */
  .word-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 16px;
    text-align: center;
  }
  .word { font-size: 38px; font-weight: 700; letter-spacing: 1px; word-break: break-all; }
  .phonetic { font-size: 16px; color: var(--muted); margin-top: 10px; }
  .progress-tip { font-size: 12px; color: var(--muted); margin-top: 14px; }

  /* ========== 四个选项按钮 ========== */
  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt-btn {
    width: 100%;
    min-height: 56px;                /* 按钮足够大，适合手机点击 */
    padding: 14px 16px;
    font-size: 16px;
    line-height: 1.4;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    cursor: pointer;
    transition: transform .12s, background .2s, border-color .2s;
  }
  .opt-btn:active { transform: scale(.97); }   /* 点击反馈动画 */
  .opt-btn.correct {
    background: #e6f0e6;
    border-color: var(--right);
    color: var(--primary-dark);
    font-weight: 600;
  }
  .opt-btn.wrong {
    background: #f6e8e4;
    border-color: var(--wrong);
    color: var(--wrong);
  }
  .opt-btn:disabled { cursor: default; }

  /* ========== 底部重置按钮 ========== */
  .reset-btn {
    padding: 12px 0;
    font-size: 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  .reset-btn:active { background: var(--card); }

  /* 答题结果提示条 */
  .feedback {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    min-height: 22px;
  }
  .feedback.ok { color: var(--right); }
  .feedback.no { color: var(--wrong); }

  /* 答错后手动触发的"下一题"按钮（默认隐藏） */
  .next-btn {
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    background: var(--primary);
    border: none;
    border-radius: 12px;
    color: #fff;
    cursor: pointer;
    transition: transform .12s, background .2s;
  }
  .next-btn:active { transform: scale(.97); background: var(--primary-dark); }
  .hidden { display: none; }

  /* 空题库提示 */
  .empty-tip {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 15px;
  }

  /* ========== 设置项（跳过开关等） ========== */
  .settings {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px 4px;
  }
  .setting-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .setting-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--primary);
  }
  .setting-text { line-height: 1.4; }

  /* 电脑端略放大间距 */
  @media (min-width: 600px) {
    body { padding-top: 40px; }
    .word { font-size: 44px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- 统计面板 -->
  <div class="stats">
    <div class="stat-item">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">总单词</div>
    </div>
    <div class="stat-item">
      <div class="stat-num known" id="statKnown">0</div>
      <div class="stat-label">认识</div>
    </div>
    <div class="stat-item">
      <div class="stat-num unknown" id="statUnknown">0</div>
      <div class="stat-label">不认识</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statNew">0</div>
      <div class="stat-label">未学习</div>
    </div>
  </div>

  <!-- 模式切换 -->
  <div class="mode-bar">
    <button class="mode-btn active" id="modeAll" data-mode="all">全部单词</button>
    <button class="mode-btn" id="modeUnknown" data-mode="unknown">只刷不认识</button>
  </div>

  <!-- 设置项 -->
  <div class="settings">
    <label class="setting-item">
      <input type="checkbox" id="skipKnownToggle">
      <span class="setting-text">本轮跳过已答对的词（开启后，已答对的词在本轮不再出现）</span>
    </label>
  </div>

  <!-- 单词卡片 -->
  <div class="word-card" id="wordCard">
    <div class="word" id="wordText">加载中…</div>
    <div class="phonetic" id="phoneticText"></div>
    <div class="progress-tip" id="progressTip"></div>
  </div>

  <!-- 对错反馈 -->
  <div class="feedback" id="feedback"></div>

  <!-- 四个选项 -->
  <div class="options" id="options"></div>

  <!-- 答错后显示的手动"下一题"按钮 -->
  <button class="next-btn hidden" id="nextBtn">下一题 →</button>

  <!-- 重置按钮 -->
  <button class="reset-btn" id="resetBtn">重置全部学习状态</button>
</div>

/* =====================================================================
 * 二、解析词库：把每行拆成 { word, phonetic, explain }
 * 格式：word /phonetic/ explain （音标可为空），过滤空行
 * =================================================================== */
function parseWords(raw) {
  return raw
    .split('\n')
    .map(line => line.trim())
    .filter(line => line.length > 0)                 // 过滤空行
    .map(line => {
      // 正则：单词部分 + 可选的 /音标/ + 剩余中文释义
      const m = line.match(/^(\S+)\s+(\/[^/]*\/)?\s*(.+)$/);
      if (!m) return null;
      return {
        word: m[1],
        phonetic: m[2] || '',
        explain: m[3].trim()
      };
    })
    .filter(w => w && w.word && w.explain);          // 过滤解析失败的行
}

const WORDS = parseWords(RAW_WORDS);

/* =====================================================================
 * 三、状态管理：localStorage 持久化（带兜底）
 * 状态定义：0 = 未学习；1 = 认识；2 = 不认识
 * wordStatus = { 单词: 状态 }
 * =================================================================== */
const STORAGE_KEY = 'cet4_word_status';
const SEEN_KEY = 'cet4_seen_in_round';
const KNOWN_IN_ROUND_KEY = 'cet4_known_in_round';  // 本轮已答对的词（受"跳过"开关影响时持久化）
const SETTINGS_KEY = 'cet4_settings';              // 用户设置项（JSON）

function loadStatus() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (!data) return {};
    const parsed = JSON.parse(data);
    // 兜底：解析结果必须是对象，否则重置
    if (typeof parsed !== 'object' || parsed === null) return {};
    return parsed;
  } catch (e) {
    console.warn('localStorage 读取失败，使用空状态', e);
    return {};
  }
}

function saveStatus() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(wordStatus));
  } catch (e) {
    console.warn('localStorage 写入失败', e);
  }
}

// 从 localStorage 恢复本轮已出过的单词集合
function loadSeenInRound() {
  try {
    const data = localStorage.getItem(SEEN_KEY);
    if (!data) return new Set();
    const parsed = JSON.parse(data);
    if (Array.isArray(parsed)) return new Set(parsed);
    return new Set();
  } catch (e) {
    console.warn('localStorage 读取本轮记录失败', e);
    return new Set();
  }
}

function saveSeenInRound() {
  try {
    localStorage.setItem(SEEN_KEY, JSON.stringify([...seenInRound]));
  } catch (e) {
    console.warn('localStorage 写入本轮记录失败', e);
  }
}

// 从 localStorage 恢复本轮已答对的词集合
function loadKnownInRound() {
  try {
    const data = localStorage.getItem(KNOWN_IN_ROUND_KEY);
    if (!data) return new Set();
    const parsed = JSON.parse(data);
    if (Array.isArray(parsed)) return new Set(parsed);
    return new Set();
  } catch (e) {
    console.warn('localStorage 读取本轮已答对记录失败', e);
    return new Set();
  }
}

function saveKnownInRound() {
  try {
    localStorage.setItem(KNOWN_IN_ROUND_KEY, JSON.stringify([...knownInRound]));
  } catch (e) {
    console.warn('localStorage 写入本轮已答对记录失败', e);
  }
}

// 从 localStorage 恢复用户设置
function loadSettings() {
  try {
    const data = localStorage.getItem(SETTINGS_KEY);
    if (!data) return { skipKnown: false };
    const parsed = JSON.parse(data);
    return {
      skipKnown: !!(parsed && parsed.skipKnown)
    };
  } catch (e) {
    console.warn('localStorage 读取设置失败', e);
    return { skipKnown: false };
  }
}

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({ skipKnown: settings.skipKnown }));
  } catch (e) {
    console.warn('localStorage 写入设置失败', e);
  }
}

let wordStatus = loadStatus();
let seenInRound = loadSeenInRound();               // 本轮已出过的单词，避免一轮内重复
let knownInRound = loadKnownInRound();             // 本轮已答对的词（仅当跳过开关开启时使用）
let settings = loadSettings();                     // 用户设置

// 获取某单词状态（默认 0 未学习）
function getStatus(word) {
  return wordStatus[word] || 0;
}

/* =====================================================================
 * 四、刷题模式与出题逻辑
 * mode: 'all' = 全部单词；'unknown' = 只刷不认识（status === 2，严格仅限已被标记为不认识的单词）
 * =================================================================== */
let mode = 'all';
let currentWord = null;   // 当前题目单词对象
let answered = false;     // 当前题是否已作答（防止重复点击）

// 根据当前模式取出可出题的单词池（排除本轮已出过的；若全部出过则开新一轮）
function getPool() {
  let base;
  if (mode === 'unknown') {
    // 严格筛选：必须是已被标记为不认识（status === 2）的单词
    // 不包含未学习(0)和已认识(1)的单词
    base = WORDS.filter(w => getStatus(w.word) === 2);
  } else {
    base = WORDS;
  }
  // 排除本轮已出过的
  let pool = base.filter(w => !seenInRound.has(w.word));
  // 跳过开关开启时，还需排除本轮已答对的词（防止本轮结束后再次洗牌时重出）
  if (settings.skipKnown) {
    pool = pool.filter(w => !knownInRound.has(w.word));
  }
  // 本轮已全部出过且 base 非空：开启新一轮（清空已出过的集合）
  // 注意：knownInRound 也要清空，让新一轮里已答对的词也能被重新抽出以巩固
  if (pool.length === 0 && base.length > 0) {
    seenInRound.clear();
    knownInRound.clear();
    saveSeenInRound();
    saveKnownInRound();
    pool = base.slice();
  }
  return pool;
}

// 数组随机打乱（Fisher-Yates 洗牌）
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 出一道新题
function nextQuestion() {
  const pool = getPool();
  const feedback = document.getElementById('feedback');
  const optionsEl = document.getElementById('options');
  feedback.textContent = '';
  feedback.className = 'feedback';
  document.getElementById('nextBtn').classList.add('hidden');   // 隐藏"下一题"按钮

  // 边界：题库不足，无法出四选一
  if (WORDS.length < 4) {
    showEmpty('单词数量不足 4 个，无法出题，请补充词库。');
    return;
  }
  // 边界：当前模式没有可刷的单词
  if (pool.length === 0) {
    const emptyMsg = mode === 'unknown'
      ? '当前没有「不认识」的单词可刷。可切换到「全部单词」模式，或继续在「全部单词」中学习积累。'
      : '当前模式没有可刷的单词了，已全部学习完成！可重置学习状态重新开始。';
    showEmpty(emptyMsg);
    return;
  }

  // 随机取目标单词，并标记本轮已出过
  currentWord = pool[Math.floor(Math.random() * pool.length)];
  seenInRound.add(currentWord.word);
  saveSeenInRound();
  answered = false;

  // 从其他单词中随机取 3 条释义做干扰项
  const others = WORDS.filter(w => w.word !== currentWord.word);
  const distractors = shuffle([...others]).slice(0, 3);

  // 1 正确 + 3 干扰，再整体打乱，防止背位置
  const options = shuffle([
    { text: currentWord.explain, correct: true },
    ...distractors.map(d => ({ text: d.explain, correct: false }))
  ]);

  renderQuestion(currentWord, options, pool.length);
}

// 渲染题目到页面
function renderQuestion(wordObj, options, poolSize) {
  document.getElementById('wordText').textContent = wordObj.word;
  document.getElementById('phoneticText').textContent = wordObj.phonetic;
  // 提示文案：根据模式区分语义，避免误导
  const tipPrefix = mode === 'unknown' ? '本轮未出过的「不认识」单词：' : '本轮未出过的单词：';
  document.getElementById('progressTip').textContent = tipPrefix + poolSize;

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';
  options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt.text;
    // 用 data 属性标记是否为正确答案，避免基于 textContent 字符串比较定位
    btn.dataset.correct = opt.correct ? '1' : '0';
    // 使用 addEventListener 替代内联 onclick，便于维护和测试
    btn.addEventListener('click', () => onAnswer(btn, opt));
    optionsEl.appendChild(btn);
  });
}

// 空题库 / 无题可刷时的提示
function showEmpty(msg) {
  document.getElementById('wordText').textContent = '提示';
  document.getElementById('phoneticText').textContent = '';
  document.getElementById('progressTip').textContent = '';
  document.getElementById('options').innerHTML =
    '<div class="empty-tip">' + msg + '</div>';
}

/* =====================================================================
 * 五、答题交互：点击选项 → 对错反馈 → 更新状态 → 自动下一题
 * =================================================================== */
function onAnswer(btn, opt) {
  if (answered) return;           // 防止重复点击
  answered = true;

  const feedback = document.getElementById('feedback');
  const allBtns = document.querySelectorAll('.opt-btn');

  if (opt.correct) {
    // 答对：标记 status = 1（认识）
    btn.classList.add('correct');
    feedback.textContent = '✓ 答对了！';
    feedback.className = 'feedback ok';
    wordStatus[currentWord.word] = 1;
    // 若"跳过已答对"开关开启，将该词加入 knownInRound，避免本轮（甚至新一轮重置）再次出现
    if (settings.skipKnown) {
      knownInRound.add(currentWord.word);
      saveKnownInRound();
    }
  } else {
    // 答错：标记 status = 2（不认识），并高亮正确答案
    btn.classList.add('wrong');
    feedback.textContent = '✗ 答错了，正确答案已标绿';
    feedback.className = 'feedback no';
    wordStatus[currentWord.word] = 2;
    // 通过 data 属性定位正确答案按钮，避免释义文本相同导致的定位失败
    allBtns.forEach(b => {
      if (b.dataset.correct === '1') b.classList.add('correct');
    });
  }

  saveStatus();
  updateStats();

  // 禁用所有选项按钮，防止连点
  allBtns.forEach(b => b.disabled = true);

  if (opt.correct) {
    // 答对：保持流畅体验，稍等片刻自动进入下一题
    setTimeout(nextQuestion, 700);
  } else {
    // 答错：暂停自动切换，留出反思时间，显示"下一题"按钮等用户手动触发
    document.getElementById('nextBtn').classList.remove('hidden');
  }
}

// 答错后用户点击"下一题"，手动进入下一题
function goNext() {
  nextQuestion();
}

/* =====================================================================
 * 六、统计面板与模式切换、重置
 * =================================================================== */
function updateStats() {
  let known = 0, unknown = 0;
  WORDS.forEach(w => {
    const s = getStatus(w.word);
    if (s === 1) known++;
    else if (s === 2) unknown++;
  });
  document.getElementById('statTotal').textContent = WORDS.length;
  document.getElementById('statKnown').textContent = known;
  document.getElementById('statUnknown').textContent = unknown;
  document.getElementById('statNew').textContent = WORDS.length - known - unknown;
}

// 切换刷题模式
function switchMode(newMode) {
  if (mode === newMode) return;
  mode = newMode;
  seenInRound.clear();   // 切换模式视为开启新一轮
  knownInRound.clear();  // 重置本轮已答对记录
  saveSeenInRound();
  saveKnownInRound();
  document.getElementById('modeAll').classList.toggle('active', mode === 'all');
  document.getElementById('modeUnknown').classList.toggle('active', mode === 'unknown');
  nextQuestion();
}

// 一键重置：清空所有单词状态
function resetAll() {
  if (!confirm('确定要清空全部学习状态吗？此操作不可恢复。')) return;
  wordStatus = {};
  seenInRound.clear();
  knownInRound.clear();
  try {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(SEEN_KEY);
    localStorage.removeItem(KNOWN_IN_ROUND_KEY);
  } catch (e) {
    console.warn('localStorage 清除失败', e);
  }
  updateStats();
  nextQuestion();
}

// 切换"跳过已答对"开关
function toggleSkipKnown(enabled) {
  settings.skipKnown = !!enabled;
  saveSettings();
  // 用户主动开启/关闭时，建议立即开新一轮以应用新规则
  seenInRound.clear();
  knownInRound.clear();
  saveSeenInRound();
  saveKnownInRound();
  nextQuestion();
}

/* =====================================================================
 * 七、页面初始化
 * 统一使用 addEventListener 绑定事件，避免内联 onclick
 * =================================================================== */
function init() {
  // 模式按钮：用 data-mode 标识目标模式
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => switchMode(btn.dataset.mode));
  });
  // 下一题按钮
  document.getElementById('nextBtn').addEventListener('click', goNext);
  // 重置按钮
  document.getElementById('resetBtn').addEventListener('click', resetAll);
  // 跳过开关：从 localStorage 恢复初值
  const skipToggle = document.getElementById('skipKnownToggle');
  skipToggle.checked = settings.skipKnown;
  skipToggle.addEventListener('change', (e) => toggleSkipKnown(e.target.checked));

  // 首屏渲染
  updateStats();
  nextQuestion();
}

init();
</script>
